services:
  - type: web
    name: gamehub-backend
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: BACKUP_CHANNEL_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
