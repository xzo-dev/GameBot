<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<title>GameHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230b0616'/><path d='M18 42V22l14 12 14-12v20' stroke='%23a78bfa' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="css/app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="env.js"></script>
</head>
<body>
<div id="app">
  <div class="bg-aura" aria-hidden="true"></div>

  <header id="topbar" class="glass">
    <button class="avatar-btn" id="top-avatar" aria-label="Profil">?</button>
    <div class="top-ident">
      <div class="top-name" id="top-name">GameHub</div>
      <div class="top-level" id="top-level">Daraja —</div>
    </div>
    <div class="wallet">
      <span class="chip"><span class="dot dot-achko"></span><b id="top-achko">0</b></span>
      <span class="chip"><span class="dot dot-coin"></span><b id="top-coins">0</b></span>
    </div>
  </header>

  <main id="view"></main>

  <div id="player-bar" class="glass hidden">
    <button id="pb-toggle" class="icon-btn">▶</button>
    <div class="pb-info"><span id="pb-title">Musiqa</span><span id="pb-sub">GameHub</span></div>
    <button id="pb-next" class="icon-btn">⏭</button>
  </div>

  <nav id="tabbar" class="glass">
    <button data-tab="home" class="tab active">🏠<span>Bosh</span></button>
    <button data-tab="games" class="tab">🎮<span>O'yinlar</span></button>
    <button data-tab="shop" class="tab">🪙<span>Do'kon</span></button>
    <button data-tab="music" class="tab">🎵<span>Musiqa</span></button>
    <button data-tab="rating" class="tab">🏆<span>Reyting</span></button>
    <button data-tab="profile" class="tab">👤<span>Profil</span></button>
  </nav>

  <aside id="chat-drawer" class="drawer hidden">
    <div class="drawer-head"><span>Xona chati</span><button id="chat-close" class="icon-btn">✕</button></div>
    <div id="chat-messages" class="chat-messages"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" maxlength="300" placeholder="Xabar yozing..." autocomplete="off">
      <button type="submit" class="send-btn">➤</button>
    </form>
  </aside>

  <div id="modal-root"></div>
  <div id="toasts"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
